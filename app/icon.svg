<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="甘雨 · 月海亭手记">
  <title>甘雨 · 月海亭手记</title>
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#deefff" />
      <stop offset="52%" stop-color="#8ecff0" />
      <stop offset="100%" stop-color="#3a80b8" />
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3a58" />
      <stop offset="100%" stop-color="#0d1f31" />
    </linearGradient>
  </defs>

  <!-- 深靛夜色圆角底 -->
  <rect width="48" height="48" rx="11" fill="url(#night)" />
  <rect x="0.6" y="0.6" width="46.8" height="46.8" rx="10.4" fill="none" stroke="url(#ice)" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- 冰蓝光晕 -->
  <circle cx="24" cy="25" r="17.5" fill="url(#ice)" opacity="0.12" />

  <!-- 麒麟双角 -->
  <g fill="none" stroke="url(#ice)" stroke-width="2.3" stroke-linecap="round">
    <path d="M20.2 19.6c-2.2-1.9-3.8-4.7-5.2-8.1" />
    <path d="M27.8 19.6c2.2-1.9 3.8-4.7 5.2-8.1" />
  </g>

  <!-- 冰元素雪花（三线六芒） -->
  <g stroke="url(#ice)" stroke-width="2.6" stroke-linecap="round">
    <path d="M24 17v16.8" />
    <path d="M16.7 21.2l14.6 8.4" />
    <path d="M31.3 21.2l-14.6 8.4" />
  </g>

  <!-- 鎏金芯 -->
  <circle cx="24" cy="25.4" r="2.5" fill="#c9a961" />
</svg>
